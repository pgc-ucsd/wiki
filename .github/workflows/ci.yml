name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:        # manual rebuild from the Actions tab

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone. The
          # git-revision-date-localized plugin reads each page's last-edit
          # date from git; with a shallow clone every page would show the
          # build date instead. Removing this silently breaks those stamps.
          fetch-depth: 0

      - name: Configure Git credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - run: pip install -r requirements.txt

      - run: mkdocs gh-deploy --force
