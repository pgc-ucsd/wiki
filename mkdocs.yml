site_name: PGC Wiki
site_description: Shared reference material for the UCSD Physics graduate community.
site_url: https://pgc-ucsd.github.io/wiki/

repo_url: https://github.com/pgc-ucsd/wiki
repo_name: pgc-ucsd/wiki
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    # navigation.sections is deliberately NOT enabled: it renders every
    # section permanently expanded. Without it, sections collapse and expand
    # on click, which keeps the sidebar short.
    - navigation.indexes      # index.md becomes the section landing page
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.action.edit     # pencil icon -> GitHub web editor
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

# Individual advisor pages are intentionally kept out of the sidebar — there
# will eventually be dozens, and they would swamp one dropdown. They are still
# built, linked from the directory table, and indexed by search. This suppresses
# the "not in nav" warning that would otherwise fail --strict.
not_in_nav: |
  research/advisors/**/*.md
  !research/advisors/index.md

plugins:
  - search
  - awesome-nav      # section order comes from docs/.nav.yml

  # "Last updated" stamp at the bottom of each page, read from that file's git
  # history — nothing to maintain by hand. Requires full git history in CI:
  # see `fetch-depth: 0` in .github/workflows/ci.yml. Do not remove that.
  - git-revision-date-localized:
      type: date                    # e.g. "August 6, 2026"
      enable_creation_date: false
      fallback_to_build_date: true  # don't fail the build if history is missing

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.details
  # The custom fence is what turns ```mermaid blocks into diagrams. Material
  # loads and themes Mermaid itself once this is present.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

# No `nav:` block on purpose. Top-level section order lives in docs/.nav.yml
# (awesome-nav plugin); everything else is inferred from the docs/ tree, so
# adding a page is just adding a file — no config edit required.
